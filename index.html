<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <img class="full-width-image" src="assets/pg01.png" alt="pg01" />
      <img class="floating-lemon" src="assets/lemon.png" alt="lemon" aria-hidden="true" />
      <img class="lemon-head" src="frames/frame_001.png" alt="lemon head" aria-hidden="true" />
      <div class="clock-overlay" aria-hidden="true">
        <img class="clock-hand hour-hand" src="assets/hous.png" alt="" />
        <img class="clock-hand minute-hand" src="assets/mins.png" alt="" />
        <img class="clock-hand second-hand" src="assets/secs.png" alt="" />
      </div>
    </section>

    <section id="about" class="page-section">
      <img class="full-width-image" src="assets/pg02.png" alt="about" />
    </section>
    <section id="skills" class="page-section">
      <img class="full-width-image" src="assets/pg02.png" alt="skills" />
    </section>
    <section id="projects" class="page-section">
      <img class="full-width-image" src="assets/pg02.png" alt="projects" />
    </section>
    <section id="journey" class="page-section">
      <img class="full-width-image" src="assets/pg02.png" alt="journey" />
    </section>
    <section id="tools" class="page-section">
      <img class="full-width-image" src="assets/pg02.png" alt="tools" />
    </section>
    <section id="contact" class="page-section">
      <img class="full-width-image" src="assets/pg02.png" alt="contact" />
    </section>
    <main class="page"></main>

    <script src="script.js"></script>
  </body>
</html>

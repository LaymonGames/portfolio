<?xml version="1.0" encoding="UTF-8"?>
<!-- Music Project Thumbnail -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#1a0f2e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg4)"/>
  
  <!-- Music visualization -->
  <g transform="translate(320, 180)">
    <!-- Waveform bars -->
    <rect x="-150" y="-40" width="12" height="80" rx="6" fill="#F5D442" opacity="0.3"/>
    <rect x="-130" y="-60" width="12" height="120" rx="6" fill="#F5D442" opacity="0.5"/>
    <rect x="-110" y="-80" width="12" height="160" rx="6" fill="#F5D442" opacity="0.7"/>
    <rect x="-90" y="-100" width="12" height="200" rx="6" fill="#F5D442" opacity="0.8"/>
    <rect x="-70" y="-120" width="12" height="240" rx="6" fill="#F5D442" opacity="0.9"/>
    <rect x="-50" y="-100" width="12" height="200" rx="6" fill="#F5D442" opacity="0.8"/>
    <rect x="-30" y="-80" width="12" height="160" rx="6" fill="#F5D442" opacity="0.7"/>
    <rect x="-10" y="-60" width="12" height="120" rx="6" fill="#F5D442" opacity="0.5"/>
    <rect x="10" y="-40" width="12" height="80" rx="6" fill="#F5D442" opacity="0.3"/>
    
    <!-- Center highlight -->
    <rect x="-70" y="-120" width="140" height="240" rx="8" fill="#F5D442" opacity="0.1"/>
  </g>
  
  <!-- Title overlay -->
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#F5D442">Original Soundtrack</text>
</svg>

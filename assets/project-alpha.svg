<?xml version="1.0" encoding="UTF-8"?>
<!-- Game Project Alpha Thumbnail -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg1)"/>
  
  <!-- Pixel art game scene -->
  <g transform="translate(280, 120)">
    <!-- Ground -->
    <rect x="-80" y="80" width="160" height="40" fill="#2d5a3f"/>
    <rect x="-80" y="80" width="160" height="8" fill="#4ade80" opacity="0.3"/>
    
    <!-- Character -->
    <rect x="-20" y="20" width="40" height="60" fill="#F5D442"/>
    <rect x="-10" y="30" width="8" height="12" fill="#6B5C1E"/>
    <rect x="2" y="30" width="8" height="12" fill="#6B5C1E"/>
    
    <!-- Platforms -->
    <rect x="-60" y="40" width="80" height="8" fill="#c9a800"/>
    <rect x="20" y="60" width="60" height="8" fill="#c9a800"/>
    
    <!-- Coins -->
    <circle cx="-40" cy="30" r="6" fill="#F5D442"/>
    <circle cx="40" cy="50" r="6" fill="#F5D442"/>
  </g>
  
  <!-- Title overlay -->
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#F5D442">Game Project Alpha</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- Pixel Art Collection Thumbnail -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="50%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg3)"/>
  
  <!-- Pixel art showcase grid -->
  <g transform="translate(320, 180)">
    <!-- Character sprite -->
    <g transform="translate(-120, -40)">
      <rect x="-16" y="-24" width="32" height="48" fill="#F5D442"/>
      <rect x="-8" y="-16" width="6" height="8" fill="#6B5C1E"/>
      <rect x="2" y="-16" width="6" height="8" fill="#6B5C1E"/>
    </g>
    
    <!-- Environment tile -->
    <g transform="translate(0, -40)">
      <rect x="-32" y="-24" width="64" height="48" fill="#2d5a3f"/>
      <rect x="-32" y="-24" width="64" height="12" fill="#4ade80" opacity="0.3"/>
    </g>
    
    <!-- Prop item -->
    <g transform="translate(120, -40)">
      <rect x="-12" y="-16" width="24" height="32" fill="#c9a800"/>
      <circle cx="0" cy="-8" r="6" fill="#F5D442"/>
    </g>
    
    <!-- Animated sprite frames -->
    <g transform="translate(-120, 60)">
      <rect x="-16" y="-24" width="32" height="48" fill="#F5D442" opacity="0.7"/>
      <rect x="-8" y="-16" width="6" height="8" fill="#6B5C1E" opacity="0.7"/>
    </g>
    
    <g transform="translate(0, 60)">
      <rect x="-16" y="-24" width="32" height="48" fill="#F5D442" opacity="0.9"/>
      <rect x="-8" y="-16" width="6" height="8" fill="#6B5C1E" opacity="0.9"/>
    </g>
    
    <g transform="translate(120, 60)">
      <rect x="-16" y="-24" width="32" height="48" fill="#F5D442"/>
      <rect x="-8" y="-16" width="6" height="8" fill="#6B5C1E"/>
    </g>
  </g>
  
  <!-- Title overlay -->
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#F5D442">Pixel Art Collection</text>
</svg>

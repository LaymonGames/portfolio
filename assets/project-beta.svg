<?xml version="1.0" encoding="UTF-8"?>
<!-- Game Project Beta Thumbnail -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b4e"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0f2040"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg2)"/>
  
  <!-- Top-down game scene -->
  <g transform="translate(320, 180)">
    <!-- Grid pattern -->
    <g opacity="0.1">
      <line x1="-150" y1="-100" x2="150" y2="-100" stroke="#F5D442" stroke-width="1"/>
      <line x1="-150" y1="-60" x2="150" y2="-60" stroke="#F5D442" stroke-width="1"/>
      <line x1="-150" y1="-20" x2="150" y2="-20" stroke="#F5D442" stroke-width="1"/>
      <line x1="-150" y1="20" x2="150" y2="20" stroke="#F5D442" stroke-width="1"/>
      <line x1="-150" y1="60" x2="150" y2="60" stroke="#F5D442" stroke-width="1"/>
      <line x1="-150" y1="100" x2="150" y2="100" stroke="#F5D442" stroke-width="1"/>
    </g>
    
    <!-- Player character -->
    <rect x="-15" y="-15" width="30" height="30" fill="#F5D442"/>
    <circle cx="-6" cy="-8" r="3" fill="#6B5C1E"/>
    <circle cx="6" cy="-8" r="3" fill="#6B5C1E"/>
    
    <!-- Enemies -->
    <rect x="-80" y="-40" width="24" height="24" fill="#e74c3c"/>
    <rect x="60" y="20" width="24" height="24" fill="#e74c3c"/>
    
    <!-- Trees -->
    <circle cx="-100" cy="-80" r="20" fill="#2d5a3f"/>
    <rect x="-106" y="-60" width="12" height="20" fill="#8B4513"/>
    
    <circle cx="100" cy="-60" r="24" fill="#2d5a3f"/>
    <rect x="94" y="-36" width="12" height="24" fill="#8B4513"/>
  </g>
  
  <!-- Title overlay -->
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#F5D442">Game Project Beta</text>
</svg>

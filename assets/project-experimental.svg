<?xml version="1.0" encoding="UTF-8"?>
<!-- Experimental Project Thumbnail -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg6)"/>
  
  <!-- Abstract experimental art -->
  <g transform="translate(320, 180)">
    <!-- Geometric shapes -->
    <circle cx="-80" cy="-50" r="40" fill="#F5D442" opacity="0.2"/>
    <rect x="40" y="-60" width="60" height="60" rx="8" fill="#c9a800" opacity="0.3" transform="rotate(15)"/>
    <polygon points="0,-80 40,20 -40,20" fill="#F5D442" opacity="0.15"/>
    
    <!-- Floating particles -->
    <circle cx="-120" cy="30" r="4" fill="#F5D442" opacity="0.6"/>
    <circle cx="100" cy="-20" r="3" fill="#FFE680" opacity="0.5"/>
    <circle cx="-60" cy="70" r="5" fill="#F5D442" opacity="0.4"/>
    <circle cx="140" cy="50" r="3" fill="#c9a800" opacity="0.6"/>
    
    <!-- Connecting lines -->
    <line x1="-80" y1="-50" x2="70" y2="-30" stroke="#F5D442" stroke-width="1" opacity="0.2"/>
    <line x1="70" y1="-30" x2="0" y2="-80" stroke="#F5D442" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Title overlay -->
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#F5D442">Experimental Project</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- Video Editing Reel Thumbnail -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923"/>
      <stop offset="50%" style="stop-color:#1a2a3a"/>
      <stop offset="100%" style="stop-color:#0f1923"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg5)"/>
  
  <!-- Video timeline visualization -->
  <g transform="translate(320, 180)">
    <!-- Timeline track -->
    <rect x="-200" y="-60" width="400" height="120" rx="8" fill="#1a1a2e"/>
    
    <!-- Video clips on timeline -->
    <rect x="-180" y="-50" width="80" height="100" rx="4" fill="#F5D442" opacity="0.3"/>
    <rect x="-90" y="-50" width="60" height="100" rx="4" fill="#c9a800" opacity="0.4"/>
    <rect x="-20" y="-50" width="100" height="100" rx="4" fill="#F5D442" opacity="0.5"/>
    <rect x="90" y="-50" width="70" height="100" rx="4" fill="#c9a800" opacity="0.3"/>
    
    <!-- Playhead -->
    <line x1="20" y1="-60" x2="20" y2="50" stroke="#F5D442" stroke-width="2"/>
    <polygon points="15,-60 25,-60 20,-70" fill="#F5D442"/>
    
    <!-- Waveform overlay -->
    <path d="M-180,0 Q-160,-30 -140,0 Q-120,30 -100,0 Q-80,-30 -60,0 Q-40,30 -20,0 Q0,-30 20,0 Q40,30 60,0 Q80,-30 100,0 Q120,30 140,0 Q160,-30 180,0" fill="none" stroke="#F5D442" opacity="0.2"/>
  </g>
  
  <!-- Title overlay -->
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#F5D442">Showreel 2024</text>
</svg>
